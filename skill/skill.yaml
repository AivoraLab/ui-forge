name: ui_forge
title: ui-forge - AI UI Component Intelligence for shadcn
description: Pick which shadcn component to use when 500+ registries mix free and paid. Ships a probed license dataset (free/freemium/paid with evidence), searches and gates components for compatibility (Radix/Base UI, Tailwind, tokens, dependencies, paywalls), and drafts up to three candidates so the user chooses the look. Fit beats fame.
